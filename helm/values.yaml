# Default values for otterwiki.
nameOverride: ""
fullnameOverride: ""

image:
  repository: redimp/otterwiki
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

## Configure the otterwiki using this mapping. The configuration will be stored
## in a configMap or for those variables considered as secret in a Secret.
## Check https://otterwiki.com/Configuration for a complete list of
## config variables.
config: {}
  # SITE_NAME: Otterwiki
  # RETAIN_PAGE_NAME_CASE: false
  # GIT_WEB_SERVER: false

## env sets environment variables to pass to the container. Can be set as name/value pairs,
## read from secrets or configmaps. For the otterwiki configuration stick to the config dict
## these will we stored in a configMap and the secrets in a Secret.
env: {}
envFromSecret: {}

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

podAnnotations: {}

podLabelsAdditional: {}

podSecurityContext: {}
  # fsGroup: 2000

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  annotations: {}
  storageClass: ""
  # subPath: path-within-volume
  # sub-path to use for otterwiki's app-data volume
  # existingClaim: name-of-existing-pvc
  # To use an existing claim persistence.enabled must also be true.
  # The options size, accessMode, annotations and storageClass are ignored,
  # subPath is still applied.

affinity: {}

nodeSelector: {}

tolerations: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: otterwiki.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: otterwiki-local-tls
  #    hosts:
  #      - otterwiki.local

route:
  enabled: true
  gateway:
    # -- Name of the (pre-existing) Gateway this HTTPRoute attaches to.
    name: traefik
    # -- Set when the Gateway lives in a different namespace than this release. Requires a ReferenceGrant in
    # that namespace allowing HTTPRoutes from this release's namespace to attach (created alongside the Gateway,
    # not by this chart).
    namespace: infra-traefik
    # -- Restrict attachment to one specific listener on the Gateway (e.g. a dedicated HTTPS listener), leave
    # empty to attach to every listener that allows it.
    sectionName: https
  # -- Free-form, in case the HTTPRoute itself ever needs annotations (rare with Gateway API)
  annotations: {}
  host: example.com
  # -- Additional hostnames routed to the same backend (e.g. a bare/www alias)
  extraHosts: []

# Upstream HTTPRoute (templates/httproute.yaml). Keep disabled: this fork uses `route` above
# (templates/route.yaml); enabling both would create two HTTPRoutes with the same name.
httproute:
  enabled: false
  annotations: {}
  hostnames:
    - otterwiki.local
  parentRefs: []
  # See Kubernetes HTTPRoute.spec.parentRefs API specification.
  # For instance:
  # - group: gateway.networking.k8s.io
  #   kind: Gateway
  #   name: your-gateway-name
  #   namespace: kube-system
  rules: []
  # See HTTPRoute.spec.rules API specification.
  # Supported are filters, matches, and timeouts. Appropriate backendRefs are added automatically
  # to each custom rule.
  # Leaving this on default creates a default rule allowing access to OtterWiki.
