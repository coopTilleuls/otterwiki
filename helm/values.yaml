# Default values for otterwiki.
image:
  repository: redimp/otterwiki
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

## Configure the otterwiki using this mapping. The configuration will be stored
## in a configMap or for those variables considered as secret in a Secret.
## Check https://otterwiki.com/Configuration for a complete list of
## config variables.
config: {}
  # SITE_NAME: Otterwiki
  # RETAIN_PAGE_NAME_CASE: false
  # GIT_WEB_SERVER: false

## env sets environment variables to pass to the container. Can be set as name/value pairs,
## read from secrets or configmaps. For the otterwiki configuration stick to the config dict
## these will we stored in a configMap and the secrets in a Secret.
env: {}
envFromSecret: {}

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: otterwiki.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: otterwiki-local-tls
  #    hosts:
  #      - otterwiki.local
route:
  enabled: true
  gateway:
    # -- Name of the (pre-existing) Gateway this HTTPRoute attaches to.
    name: traefik
    # -- Set when the Gateway lives in a different namespace than this release. Requires a ReferenceGrant in
    # that namespace allowing HTTPRoutes from this release's namespace to attach (created alongside the Gateway,
    # not by this chart).
    namespace: infra-traefik
    # -- Restrict attachment to one specific listener on the Gateway (e.g. a dedicated HTTPS listener), leave
    # empty to attach to every listener that allows it.
    sectionName: https
  # -- Free-form, in case the HTTPRoute itself ever needs annotations (rare with Gateway API)
  annotations: {}
  host: example.com
  # -- Additional hostnames routed to the same backend (e.g. a bare/www alias)
  extraHosts: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  annotations: {}
  storageClassName: ""

nodeSelector: {}

tolerations: []

affinity: {}
